hostname r2
password zebra
log file /var/log/frr/bgpd.log

ip prefix-list LAN-INTERNE permit 192.168.20.0/24
ip prefix-list LAN-INTERNE permit 192.168.21.0/24

ip prefix-list DA-AS3 permit 2.0.0.0/26
ip prefix-list DA-AS3 permit 2.0.0.64/26

router bgp 1

    no bgp network import-check
    
    neighbor 1.0.0.6 remote-as 3
    neighbor 1.0.0.6 description Router r6


    address-family ipv4 unicast
        neighbor 1.0.0.6 prefix-list LAN-INTERNE out
        neighbor 1.0.0.6 prefix-list DA-AS3 in
        neighbor 1.0.0.6 activate

        network 192.168.20.0/24
        network 192.168.21.0/24
    exit-address-family