services:
  mongodb:
    image: mongo:7.0
    container_name: datalake-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      datalake-net:
        aliases:
          - mongo.cyber.net

  spark-master:
    image: apache/spark:3.5.1-scala2.12-java11-ubuntu
    container_name: datalake-spark-master
    user: root
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq python3 python3-pip && 
      /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master" 
    environment:
      - SPARK_MODE=master
      - PYSPARK_PYTHON=python3
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
    ports:
      - "8081:8080"
      - "7077:7077"
    volumes:
      - ../storage/data:/opt/spark/data
      - ../storage/src:/opt/spark/src
    networks:
      - datalake-net

  spark-worker:
    image: apache/spark:3.5.1-scala2.12-java11-ubuntu
    container_name: datalake-spark-worker
    user: root
    command: >
      bash -c "apt-get update -qq && apt-get install -y -qq python3 python3-pip && 
      /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077"
    environment:
      - SPARK_MODE=worker
      - PYSPARK_PYTHON=python3
      - SPARK_WORKER_CORES=4
      - SPARK_WORKER_MEMORY=10G
    depends_on:
      - spark-master
    volumes:
      - ../storage/data:/opt/spark/data
      - ../storage/src:/opt/spark/src
    networks:
      - datalake-net
  streamlit:
    build:
      context: ./build_admin
    container_name: datalake-streamlit
    # Con network_mode host il container condivide la rete dell'host:
    # - vede direttamente 2.0.0.226:11434 (Ollama su Kathará)
    # - la porta 8080 è già esposta sull'host (accedere via http://localhost:8080)
    network_mode: host
    volumes:
      - ../storage/src:/app
      - ../storage/data:/opt/spark/data
      - ../catture:/catture
    working_dir: /app
    command: streamlit run app.py --server.port 8080 --server.address 0.0.0.0
    depends_on:
      - mongodb
volumes:
  mongodb_data:

networks:
  datalake-net:
    driver: bridge
