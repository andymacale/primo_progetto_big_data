hostname spike_2
password zebra
log file /var/log/frr/bgpd.log

router bgp 64516
 timers bgp 3 9
 bgp router-id 10.255.0.4
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 
 neighbor fabric peer-group
 neighbor fabric remote-as external
 neighbor fabric advertisement-interval 0
 neighbor fabric timers connect 10
 neighbor eth0 interface peer-group fabric
 neighbor eth1 interface peer-group fabric

 neighbor TOR peer-group
 neighbor TOR remote-as external
 neighbor TOR advertisement-interval 0
 neighbor TOR timers connect 10
 neighbor eth2 interface peer-group TOR
 neighbor eth3 interface peer-group TOR

 address-family ipv4 unicast
  neighbor fabric activate
  neighbor TOR activate
  redistribute connected route-map LOOPBACKS
  maximum-paths 64
 exit-address-family

 address-family l2vpn evpn
  neighbor fabric activate
  neighbor TOR activate
 exit-address-family

route-map LOOPBACKS permit 10
 match interface lo
